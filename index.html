<!DOCTYPE html>
<html>
<head>
<style> 
div{
  width: 100px;
  height: 100px;
  background-color: pink;
  margin-bottom: 20px;
}

div:hover.longer {
    width: 400px;
    transition: width 2s;
}

div:hover.larger {
    width: 200px;
    height: 200px;
    transition: 2s;
}

</style>
</head>
<body>

<div class="longer"></div>
<div class="larger"></div>

</body>
</html>
